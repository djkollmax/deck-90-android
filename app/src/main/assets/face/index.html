<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deck 90</title>
<link rel="stylesheet" href="stereo-face.css">
<link rel="stylesheet" href="face.css">
</head>
<body>
<main class="stereo stereo-panel" id="stereoView">
  <div class="st-face" id="stFace">
    <img class="st-photo" src="img/front.jpg" alt="" draggable="false">
    <div class="st-display" id="stDisplay" style="left:28.886%;top:42.857%;width:53.373%;height:27.458%"></div>
    <i class="st-aux" style="left:93.753%;top:53.247%;width:1.299%;height:4.824%"></i>
  </div>
  <section class="now" id="now" aria-label="Sintonía actual">
    <div class="now-top"><span class="now-band" id="nowBand">FM1 · 1</span><span class="now-q" id="nowQ"></span></div>
    <div class="now-name" id="nowName">DECK 90</div>
    <div class="now-song" id="nowSong"></div>
  </section>
  <section class="pad" id="pad">
    <div class="pad-bands" id="padBands" aria-label="Bandas"></div>
    <div class="pad-mems" id="padMems" aria-label="Memorias"></div>
    <section class="meters" id="meters" aria-label="Medidores">
      <canvas id="mCanvas" role="button" tabindex="0" aria-label="Cambiar diseño del medidor"></canvas>
    </section>
    <div class="pad-views" id="padViews" aria-label="Vistas"><button data-v="radio">RADIO</button><button data-v="vu">VU</button><button data-v="spec">ESPECTRO</button><button data-v="stereo">ESTÉREO</button></div>
    <div class="pad-row">
      <button data-k="prev" aria-label="Anterior">◀◀</button><button data-k="sel" aria-label="Reproducir o pausar" class="sel">▶ ❚❚</button><button data-k="next" aria-label="Siguiente">▶▶</button>
      <button data-k="scan">SCAN</button><button data-k="disp">DISP</button>
    </div>
  </section>
</main>
<!-- the radio search (SCAN held), as on the PC: face.js fills the countries, the list and the numbers -->
<div id="rfFind" role="dialog" aria-label="Buscar radio">
  <div class="rf-card">
    <div class="rf-head"><span>BUSCAR RADIO EN EL MUNDO</span><button type="button" id="rfClose" aria-label="Cerrar">✕</button></div>
    <div class="rf-row">
      <label class="rf-name">NOMBRE<input id="rfName" spellcheck="false" autocomplete="off" enterkeyhint="search" placeholder="jazz, BBC, Radio Paradise…"></label>
      <label class="rf-country">PAÍS<select id="rfCountry"></select></label>
      <button type="button" id="rfGo">BUSCAR</button>
    </div>
    <div class="rf-msg" id="rfMsg"></div>
    <div id="rfList" class="rf-list" role="listbox"></div>
    <div class="rf-keep">GUARDAR LA QUE SUENA EN <span id="rfBand">FM1</span>:<div id="rfKeep"></div></div>
    <div class="rf-help">Tocá una radio para escucharla. Las de calidad CD dicen HI-FI. Los datos son de Radio Browser.</div>
  </div>
</div>
<div id="toast" role="status"></div>
<script src="dp940-display.js"></script>
<script src="face.js"></script>
</body>
</html>
